# Base Sepolia e2e — manual only (keys + faucet). Never on push/PR.
# Secrets: PRIVATE_KEY, BASE_SEPOLIA_RPC
# Optional: CIRCLE_KEY (for mode=circle real USDC)
name: e2e-sepolia

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full = MockUSDC stack; circle = Circle USDC production deploy"
        type: choice
        options:
          - full
          - circle
        default: full

permissions:
  contents: read

concurrency:
  group: e2e-sepolia-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  sepolia:
    name: e2e sepolia (${{ inputs.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/package-lock.json

      - name: Install forge-std
        working-directory: cipher/contracts
        run: |
          if [ ! -d lib/forge-std/src ]; then
            forge install foundry-rs/forge-std --no-git
          fi

      - run: npm ci

      - name: Write demo-kit.env from secrets
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          BASE_SEPOLIA_RPC: ${{ secrets.BASE_SEPOLIA_RPC }}
          CIRCLE_KEY: ${{ secrets.CIRCLE_KEY }}
        run: |
          set -euo pipefail
          test -n "${PRIVATE_KEY:-}" || { echo "missing secret PRIVATE_KEY"; exit 1; }
          test -n "${BASE_SEPOLIA_RPC:-}" || { echo "missing secret BASE_SEPOLIA_RPC"; exit 1; }
          case "$PRIVATE_KEY" in
            0x*|0X*) PK="$PRIVATE_KEY" ;;
            *) PK="0x${PRIVATE_KEY}" ;;
          esac
          {
            echo "PRIVATE_KEY=$PK"
            echo "PROTOCOL_KEY=$PK"
            echo "CHAIN_RPC=$BASE_SEPOLIA_RPC"
            echo "BASE_SEPOLIA_RPC=$BASE_SEPOLIA_RPC"
            echo "CHAIN_ID=84532"
            if [ -n "${CIRCLE_KEY:-}" ]; then
              case "$CIRCLE_KEY" in
                0x*|0X*) CK="$CIRCLE_KEY" ;;
                *) CK="0x${CIRCLE_KEY}" ;;
              esac
              echo "CIRCLE_KEY=$CK"
            fi
          } > scripts/demo-kit.env
          chmod 600 scripts/demo-kit.env

      - name: Run e2e:sepolia:${{ inputs.mode }}
        run: |
          set -euo pipefail
          set -a && source scripts/demo-kit.env && set +a
          npm run "e2e:sepolia:${{ inputs.mode }}"
