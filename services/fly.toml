# Deploy from services/:
#   fly deploy -a ciphersentry --remote-only
#
# Dockerfile path is relative to this file's directory (services/).

app = "ciphersentry"
primary_region = "iad"

[build]
  dockerfile = "fly/Dockerfile"

[env]
  GATEWAY_HOST = "0.0.0.0"
  GATEWAY_PORT = "8080"
  PORT = "8080"
  AUTH_REQUIRED = "0"
  TICK_MS = "60000"
  BATCH_INTERVAL_MS = "0"
  BATCH_MAX_PENDING = "99"
  # memory bus/kv on single-machine Fly demo (no NATS/Redis sidecars)
  NATS_REQUIRE = "0"
  REDIS_REQUIRE = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
