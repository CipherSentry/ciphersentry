# Public JSON-RPC + WS gateway on Fly
# Deploy from repo root:
#   fly deploy -a ciphersentry-node -c services/fly/fly.gateway.toml --dockerfile services/fly/Dockerfile --remote-only
# Build context must be services/ — use:
#   cd services && fly deploy -a ciphersentry-node -c fly/fly.gateway.toml --dockerfile fly/Dockerfile --remote-only

app = "ciphersentry"
primary_region = "iad"

[build]
  # Path relative to this config file's directory (services/fly/)
  dockerfile = "Dockerfile"

[env]
  GATEWAY_HOST = "0.0.0.0"
  GATEWAY_PORT = "8080"
  PORT = "8080"
  AUTH_REQUIRED = "0"
  TICK_MS = "60000"
  BATCH_INTERVAL_MS = "0"
  BATCH_MAX_PENDING = "99"
  # embedded memory indexer (start-public.sh)
  INDEXER_UPSTREAM = "http://127.0.0.1:8081"
  INDEXER_MEMORY = "1"
  INDEXER_FORCE_WS = "1"
  INDEXER_PORT = "8081"
  NATS_URL = ""

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "90s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
