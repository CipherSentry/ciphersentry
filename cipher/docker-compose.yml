name: ciphersentry-infra

# Local infra — run from the REPO ROOT: `docker compose up -d`
# pg :5432 · clickhouse :8123 · nats :4222 · valkey :6379
# In production these become managed services.

services:
  postgres:
    image: postgres:16-alpine
    container_name: ciphersentry-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: cent
      POSTGRES_PASSWORD: cent
      POSTGRES_DB: ciphersentry
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cent -d ciphersentry"]
      interval: 5s
      timeout: 3s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: ciphersentry-ch
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ciphersentry
      CLICKHOUSE_USER: cent
      CLICKHOUSE_PASSWORD: cent
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "8123:8123"   # HTTP — indexer transport
      - "9000:9000"   # native protocol (admin use)
    volumes:
      - chdata:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://localhost:8123/ping' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    container_name: ciphersentry-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - natsdata:/data

  valkey:
    image: valkey/valkey:7.2-alpine
    container_name: ciphersentry-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  chdata:
  natsdata:
  redisdata:
